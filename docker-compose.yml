# Test local uniquement (EasyPanel déploie depuis le Dockerfile).
#   docker compose up --build   puis   http://localhost:8080
#   (autre port local : APP_PORT=8095 docker compose up --build)
services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: db
      DB_NAME: auryadeco
      DB_USER: auryadeco
      DB_PASSWORD: local-dev-password
      ADMIN_USER: admin
      ADMIN_PASSWORD: local-dev-admin
      SEED_DEMO_PRODUCTS: "1"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4.4
    environment:
      MARIADB_DATABASE: auryadeco
      MARIADB_USER: auryadeco
      MARIADB_PASSWORD: local-dev-password
      MARIADB_ROOT_PASSWORD: local-dev-root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

volumes:
  uploads:
  db:
