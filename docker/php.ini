; AuryaDeco : réglages PHP de production (complètent php.ini-production).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

upload_max_filesize = 10M
post_max_size = 40M
max_file_uploads = 20
memory_limit = 256M
; L'assistant déco attend la réponse de Gemini.
max_execution_time = 60

date.timezone = Africa/Tunis

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; Le code ne change pas dans un conteneur : pas de vérification des dates de fichiers.
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
